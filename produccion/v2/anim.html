<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vídeo 2 · Las muñecas rusas</title>
<link rel="stylesheet" href="../motor-video/comun.css">
</head>
<body>
<script src="../motor-video/comun.js"></script>
<script src="../motor-video/iconos.js"></script>
<script src="../motor-video/mapas/espana.js"></script>
<script src="../motor-video/mapas/madrid.js"></script>
<script src="../motor-video/datos/v2.js"></script>
<script>
'use strict';
const C = M.C;
const ap = (el, base, t, t0, tipo = 'pop', dur = 0.55) => M.ponAp(el, base, M.aparicion(t, t0, dur, tipo));
/** Coloca una persona con los pies en (x, pies). */
const ponP = (el, x, pies, s = 1, extra = {}) => M.pon(el, { x, y: pies - 50 * s, s, ...extra });
const bamboleo = (t, i) => ({ dy: M.onda(t, 1.7 + (i % 3) * 0.23, 2.2, i * 1.3), r: M.onda(t, 2.9 + (i % 2) * 0.5, 1.3, i * 2.1) });
/** Salto suave (0 → alto → 0) que empieza en t0. */
const brinco = (t, t0, alto = 24, dur = 0.5) => Math.sin(Math.PI * M.p(t, t0, dur)) * alto;

// ───────── Niveles (colores fijos del SPEC) ─────────
const NIVEL = [
  { color: C.ayto, nombre: 'Municipio' },
  { color: C.prov, nombre: 'Provincia' },
  { color: C.ccaa, nombre: 'Comunidad\nautónoma' },
  { color: C.estado, nombre: 'Estado' },
  { color: C.ue, nombre: 'Unión Europea' },
];
const tintaSobre = (c) => (c === C.ayto || c === C.prov ? C.tinta : C.blanco);
const rotNivel = (padre, txt, color, tam = 32) => M.rotulo(padre, txt, { tam, fondo: color, color: tintaSobre(color) });
const PALIDO = '#F1E9DA';

// ───────── Muñecas ─────────
const tripaUE = () => { let s = ''; for (let i = 0; i < 12; i++) { const a = (i * Math.PI) / 6; s += M.estrellaPath(+(12 * Math.sin(a)).toFixed(1), +(22 - 12 * Math.cos(a)).toFixed(1), 3.4, C.estrella); } return s; };
const marcadoMuneca = (color) => (color === C.ue ? M.iconos.muneca({ color, texto: ' ' }) + tripaUE() : M.iconos.muneca({ color }));
M.registrarIcono('munecaNivel', (o) => marcadoMuneca(o.color || C.ayto));
M.registrarIcono('munecaProv', () => marcadoMuneca(C.prov));
M.registrarIcono('munecaCcaa', () => marcadoMuneca(C.ccaa));
M.registrarIcono('munecaEstado', () => marcadoMuneca(C.estado));
M.registrarIcono('munecaUE', () => marcadoMuneca(C.ue));
const muneca = (padre, color) => M.icono('munecaNivel', padre, { color });
/** Coloca una muñeca (icono o partida) con la base en y = base. */
const ponM = (el, x, base, s, extra = {}) => M.pon(el, { x, y: base - 50 * s, s, ...extra });

// Muñeca que se abre: tres capas (interior, mitad de abajo, mitad de arriba) hermanas dentro de `padre`.
let clipsListos = false;
function prepararClips() {
  if (clipsListos) return; clipsListos = true;
  const a = M.el('clipPath', { id: 'v2-mitad-arriba' }, M.defs); M.el('rect', { x: -80, y: -90, width: 160, height: 88 }, a);
  const b = M.el('clipPath', { id: 'v2-mitad-abajo' }, M.defs); M.el('rect', { x: -80, y: -6, width: 160, height: 100 }, b);
}
function munecaPartida(padre, color) {
  prepararClips();
  const costura = `<path d="M-25.3,-4 L25.3,-4" stroke="${C.tinta}" stroke-width="3.5" stroke-linecap="round"/>`;
  const fondo = M.g(padre);
  const boca = M.el('ellipse', { cx: 0, cy: -4, rx: 23, ry: 6, fill: M.oscurece(color, 0.45), stroke: C.tinta, 'stroke-width': 3 }, fondo);
  const abajo = M.g(padre);
  M.g(abajo, { 'clip-path': 'url(#v2-mitad-abajo)' }).innerHTML = marcadoMuneca(color) + costura;
  const arriba = M.g(padre);
  const tapa = M.g(arriba);
  M.g(tapa, { 'clip-path': 'url(#v2-mitad-arriba)' }).innerHTML = marcadoMuneca(color) + costura;
  return { fondo, abajo, arriba, tapa, boca, capas: [fondo, abajo, arriba] };
}
/** o: {x, base, s, o, abre (0..1), r, dyArriba, dyAbajo} */
function ponMP(m, o) {
  const s = o.s, y = o.base - 50 * s, op = o.o === undefined ? 1 : o.o, abre = o.abre || 0;
  M.pon(m.fondo, { x: o.x, y, s, r: o.r, o: abre > 0.02 ? op : 0 });
  M.pon(m.abajo, { x: o.x, y: y + (o.dyAbajo || 0), s, r: o.r, o: op });
  M.pon(m.arriba, { x: o.x, y: y + (o.dyArriba || 0), s, r: o.r, o: op });
  M.pon(m.tapa, { x: abre * 6, y: -abre * 30, r: -abre * 12 });
}
/** Reordena los hijos de `cont` según `lista` solo si hace falta (determinista). */
function ordenar(cont, lista) {
  const hijos = cont.children; let igual = hijos.length === lista.length;
  if (igual) for (let i = 0; i < lista.length; i++) if (hijos[i] !== lista[i]) { igual = false; break; }
  if (!igual) lista.forEach((el) => cont.appendChild(el));
}
/** Medallón con el número de muñeca. */
function insignia(padre, n, color) {
  const g = M.g(padre);
  M.el('circle', { r: 24, fill: color, stroke: C.tinta, 'stroke-width': 3.5 }, g);
  M.texto(g, String(n), { tam: 30, peso: 900, color: tintaSobre(color), y: 1 });
  return g;
}

// ───────── Iconos propios ─────────
M.registrarIcono('libritos', () => `<rect x="-44" y="-30" width="18" height="74" rx="3" fill="#C47A6A" stroke="#2B2D42" stroke-width="3"/><rect x="-24" y="-40" width="20" height="84" rx="3" fill="#8CC0DE" stroke="#2B2D42" stroke-width="3"/><rect x="-2" y="-24" width="16" height="68" rx="3" fill="#A3B16B" stroke="#2B2D42" stroke-width="3"/>` +
  `<rect x="18" y="-34" width="18" height="78" rx="3" fill="#9D8EC7" stroke="#2B2D42" stroke-width="3" transform="rotate(8 27 44)"/><path d="M-50,46 L50,46" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>`);
M.registrarIcono('columpio', (o) => {
  const K = C.tinta, S = `stroke="${K}" stroke-linejoin="round" stroke-linecap="round"`;
  const roto = o.roto !== false;
  return `<path d="M-40,-42 L-52,48 M40,-42 L52,48" ${S} stroke-width="9"/><path d="M-40,-42 L-52,48 M40,-42 L52,48" stroke="#7D8597" stroke-width="4.5" stroke-linecap="round"/>` +
    `<rect x="-48" y="-48" width="96" height="12" rx="5" fill="#7D8597" ${S} stroke-width="3.5"/>` +
    `<path d="M-16,-36 L-16,22" ${S} stroke-width="3" stroke-dasharray="5 3"/>` +
    (roto ? `<path d="M16,-36 L16,-6" ${S} stroke-width="3" stroke-dasharray="5 3"/><path d="M12,-2 L20,-8 M13,4 L19,0" ${S} stroke-width="2.5"/>` +
      `<rect x="-24" y="18" width="46" height="9" rx="3" fill="#F2A65A" ${S} stroke-width="3" transform="rotate(38 -16 22)"/>`
      : `<path d="M16,-36 L16,22" ${S} stroke-width="3" stroke-dasharray="5 3"/><rect x="-24" y="20" width="48" height="9" rx="3" fill="#F2A65A" ${S} stroke-width="3"/>`) +
    `<path d="M-62,48 L62,48" ${S} stroke-width="4"/>`;
});
const marcadoFarola = (on) => M.iconos.farola({ encendida: on });

// ═════════ Escena 1: cuatro problemas ═════════
M.escena(1, (E) => {
  const g = E.g;
  const X = [190, 490, 790, 1090], CY = 350, W = 250, H = 300;
  const NIVC = [C.ayto, C.ccaa, C.estado, C.ue];
  const tA = E.m('A quién'), tProfe = E.m('paga a tu profe'), tDec = E.m('quién decide'), tDin = E.m('qué dinero'), tNo = E.m('No es la misma'), tHoy = E.m('Hoy vamos');
  const tIn = [0.15, tProfe - 0.45, tDec - 0.15, tDin - 0.1];
  const NOM = ['La farola', 'El profe', 'El pasaporte', 'El dinero'];
  const cartas = X.map((x, i) => {
    const c = M.g(g);
    const marco = M.tarjeta(c, { ancho: W, alto: H, fondo: C.blanco, trazo: C.gris, grosor: 6, radio: 28 });
    const vacio = M.texto(c, '?', { tam: 120, peso: 900, color: C.grisClaro, y: 4 });
    const cont = M.g(c);
    const rot = M.rotulo(g, NOM[i], { tam: 30, fondo: C.blanco, color: C.tinta, borde: C.gris, grosor: 3 });
    const preg = M.icono('interrogacion', g, { color: C.grisClaro });
    const mu = muneca(g, NIVC[i]);
    return { c, marco, vacio, cont, rot, preg, mu, x };
  });
  // 1 · farola de noche
  const c1 = cartas[0].cont;
  M.el('rect', { x: -105, y: -130, width: 210, height: 240, rx: 20, fill: '#3E4A6B' }, c1);
  const r1 = M.azar(5);
  for (let i = 0; i < 9; i++) M.el('circle', { cx: -90 + r1() * 180, cy: -118 + r1() * 70, r: 1.5 + r1() * 2, fill: '#FFF7D6', opacity: 0.8 }, c1);
  M.el('circle', { cx: 62, cy: -92, r: 16, fill: '#FFF2C2' }, c1); M.el('circle', { cx: 70, cy: -98, r: 14, fill: '#3E4A6B' }, c1);
  M.el('rect', { x: -105, y: 72, width: 210, height: 38, fill: '#5C6378' }, c1);
  M.el('path', { d: 'M-105,72 L105,72', stroke: '#8D99AE', 'stroke-width': 4 }, c1);
  const farola = M.g(c1); let farolaOn = null;
  const chispa = M.svg(c1, `<path d="M0,-14 L4,-4 L14,-2 L5,4 L8,14 L0,7 L-8,14 L-5,4 L-14,-2 L-4,-4Z" fill="#FFE8A3" stroke="${C.tinta}" stroke-width="2"/>`);
  // 2 · profe
  const profe = M.persona(cartas[1].cont, { lleva: 'libro', gafas: true, ropa: M.ROPA[8], peinado: 'largo', piel: M.PIEL[2], pelo: M.PELO[1] });
  const monedas = M.icono('monedas', cartas[1].cont);
  const pizarra = M.g(cartas[1].cont);
  M.el('rect', { x: -100, y: -125, width: 200, height: 70, rx: 8, fill: '#3E6B5A', stroke: C.tinta, 'stroke-width': 4 }, pizarra);
  M.texto(pizarra, '2 + 3 = 5', { tam: 30, peso: 800, color: '#F4F1E6', y: -90 });
  // 3 · pasaporte y DNI
  const dni = M.icono('dni', cartas[2].cont); const pas = M.icono('pasaporte', cartas[2].cont);
  // 4 · euro
  const euro = M.icono('euro', cartas[3].cont); const euro2 = M.icono('euro', cartas[3].cont);
  const tit1 = M.rotulo(g, '¿A quién se lo dices?', { tam: 46, fondo: C.tinta });
  const tit2 = M.rotulo(g, '¡No es la misma persona!', { tam: 46, fondo: C.tinta });
  return (t) => {
    cartas.forEach((k, i) => {
      const a = M.aparicion(t, 0.15 + i * 0.12, 0.6, 'sube');
      const lleno = M.e(t, tIn[i], 0.35);
      M.opacidad(k.vacio, 1 - lleno);
      M.pon(k.cont, { s: 0.6 + 0.4 * M.e(t, tIn[i], 0.5, 'outBack'), o: lleno });
      k.marco.setAttribute('stroke-dasharray', lleno > 0 ? 'none' : '16 12');
      M.ponAp(k.c, { x: k.x, y: CY + M.onda(t, 3.2, 3, i) - brinco(t, tHoy + i * 0.18, 16) }, a);
      k.marco.setAttribute('stroke', M.mezcla(C.gris, NIVC[i], M.e(t, tNo + i * 0.15, 0.5)));
      ap(k.rot, { x: k.x, y: 552 }, t, tIn[i] + 0.3, 'fundido');
      const sale = M.e(t, tNo + i * 0.15, 0.3);
      M.ponAp(k.preg, { x: k.x + 104, y: CY - 140 + M.onda(t, 1.6, 4, i), s: 0.52 * (1 - sale) + 0.001, r: M.onda(t, 2, 8, i), o: 1 - sale }, M.aparicion(t, tIn[i] + 0.45, 0.5));
      ap(k.mu, { x: k.x + 104, y: CY - 145 + M.onda(t, 2.2, 3, i) - brinco(t, tHoy + i * 0.18, 26), s: 0.78, r: M.onda(t, 2.5, 4, i) }, t, tNo + 0.15 + i * 0.15);
    });
    // farola que parpadea y se funde
    const patron = [1, 0, 1, 1, 0, 0, 1, 0, 0, 0];
    const on = t < 0.8 || (t < 2.4 && patron[Math.floor(t * 8) % 10] === 1);
    if (on !== farolaOn) { farolaOn = on; farola.innerHTML = marcadoFarola(on); }
    M.pon(farola, { x: 0, y: -8, s: 1.75 });
    M.pon(chispa, { x: 0, y: -94, s: M.ventana(t, 2.3, 2.75, 0.15) * 1.6, r: t * 90 });
    // profe
    ponP(profe, -40, 108, 1.45, bamboleo(t, 1));
    M.brazo(profe, 'i', 10 + M.onda(t, 1.6, 8));
    ap(monedas, { x: 58, y: 40 + M.onda(t, 1.4, 5), s: 0.62, r: M.onda(t, 2, 6) }, t, tProfe + 0.2);
    // pasaporte y DNI
    ap(dni, { x: -38, y: 50 + M.onda(t, 2.4, 3), s: 1.05, r: -12 }, t, tDec + 0.15);
    ap(pas, { x: 32, y: -25 + M.onda(t, 2.4, 3, 1), s: 1.55, r: 8 + M.onda(t, 3, 2) }, t, tDec - 0.05);
    // euro que gira
    const gira = Math.abs(Math.cos(t * 2.2));
    ap(euro, { x: -10, y: -25, s: 1.85, sx: Math.max(0.12, gira) }, t, tDin - 0.05);
    ap(euro2, { x: 55, y: 75 + M.onda(t, 1.8, 3), s: 0.8, r: M.onda(t, 3, 8) }, t, tDin + 0.3);
    // títulos
    M.ponAp(tit1, { x: 640, y: 80, o: 1 - M.e(t, tNo - 0.3, 0.3) }, M.aparicion(t, tA - 0.15, 0.5, 'sube'));
    M.ponAp(tit2, { x: 640, y: 80 + M.onda(t, 2.5, 2) }, M.aparicion(t, tNo, 0.55, 'pop'));
  };
});

// ═════════ Escena 2: la muñeca que se abre en cinco ═════════
M.escena(2, (E) => {
  const g = E.g;
  const SX = [165, 352, 572, 818, 1082], SS = [1.2, 1.5, 1.8, 2.15, 2.55], BASE = 470;
  const tMu = E.m('muñecas rusas'), tUna = E.m('una dentro de otra'), tPeq = E.m('La más pequeña'), tMun = E.m('es el municipio');
  const tProv = E.m('la provincia'), tCom = E.m('la comunidad autónoma'), tEst = E.m('el Estado'), tToda = E.m('toda España'), tFue = E.m('por fuera'), tUE = E.m('Unión Europea');
  const tNom = [tMun + 0.3, tProv, tCom, tEst, tUE];
  const T = (k) => tUna - 0.15 + (4 - k) * 0.48;                // la muñeca k (4…1) se abre
  const tE = (k) => T(k + 1) + 0.08;                      // la muñeca k (0…3) sale de su madre
  const tSl = (k) => (k === 0 ? tE(0) + 0.6 : T(k) + 0.5); // la muñeca k va a su sitio
  const suelo = M.el('rect', { x: 0, y: BASE - 2, width: 1280, height: 400, fill: C.arena }, g);
  const sombras = SX.map((x, k) => { const s = M.sombra(g, 40 * SS[k], 8); return s; });
  const cont = M.g(g);
  const mus = NIVEL.map((n) => munecaPartida(cont, n.color));
  const rots = NIVEL.map((n) => rotNivel(g, n.nombre, n.color, 30));
  const subE = M.texto(g, 'toda España', { tam: 26, peso: 850, color: C.grisOsc });
  const subU = M.texto(g, 'por fuera de todo', { tam: 26, peso: 850, color: C.grisOsc });
  const peq = M.g(g);
  M.texto(peq, 'La más pequeña', { tam: 28, peso: 900, color: C.tinta });
  const flechaPeq = M.flecha(g, { x1: 165, y1: 292, x2: 165, y2: 332, color: C.tinta, grosor: 5 });
  const anillo = M.g(g);
  for (let i = 0; i < 12; i++) { const a = (i * Math.PI) / 6; M.svg(anillo, M.estrellaPath(+(150 * Math.cos(a)).toFixed(1), +(150 * Math.sin(a)).toFixed(1), 13, C.estrella, `stroke="${C.tinta}" stroke-width="2.5"`)); }
  const tit1 = M.rotulo(g, 'Como muñecas rusas', { tam: 46, fondo: C.tinta });
  const tit2 = M.rotulo(g, 'Una dentro de otra', { tam: 46, fondo: C.tinta });
  const flechaTam = M.flecha(g, { x1: 120, y1: 618, x2: 1160, y2: 618, color: C.gris, grosor: 6 });
  const menor = M.texto(g, 'de menor…', { tam: 24, peso: 850, color: C.grisOsc, anchor: 'start' });
  const mayor = M.texto(g, '…a mayor', { tam: 24, peso: 850, color: C.grisOsc, anchor: 'end' });
  return (t) => {
    M.pon(suelo, { o: 1 });
    // orden de dibujo: mientras una muñeca está saliendo, va entre el interior y la mitad de abajo de su madre
    const dentro = (k) => t < tE(k) + 0.25;
    const lista = (k) => {
      const m = mus[k].capas;
      if (k === 0) return m;
      return dentro(k - 1) ? [m[0], ...lista(k - 1), m[1], m[2]] : [...m, ...lista(k - 1)];
    };
    ordenar(cont, lista(4));
    for (let k = 4; k >= 0; k--) {
      const abre = k >= 1 ? Math.min(M.e(t, T(k), 0.2), 1 - M.e(t, T(k) + 0.42, 0.2, 'inOutQuad')) : 0;
      let base = BASE, s = SS[k], o = 1;
      if (k === 4) { const a = M.aparicion(t, 0.15, 0.6, 'sube'); o = a.o; base += a.dy; }
      else {
        const pe = M.p(t, tE(k), 0.5);
        o = t >= tE(k) ? 1 : 0;
        base = BASE - Math.sin(Math.PI * pe) * SS[k + 1] * 66;
        s = SS[k] * M.lerp(0.6, 1, M.ease.outCubic(pe));
      }
      const mov = M.e(t, tSl(k), 0.6, 'inOutCubic');
      const x = M.lerp(640, SX[k], mov);
      const quieta = M.e(t, tSl(k) + 0.6, 0.3);
      const salto = brinco(t, tNom[k] - 0.15, 30, 0.55);
      ponMP(mus[k], { x, base: base - salto, s, o, abre, r: M.onda(t, 2.6, 2.5, k) * quieta });
      M.pon(sombras[k], { x, y: BASE + 2, s: (1 - salto / 60) * (s / SS[k]), o: o * 0.9 });
      ap(rots[k], { x: SX[k], y: k === 2 ? 550 : 540 }, t, tNom[k] - 0.1);
    }
    ap(subE, { x: SX[3], y: 588 }, t, tToda, 'fundido');
    ap(subU, { x: SX[4], y: 588 }, t, tFue, 'fundido');
    const fueraPeq = M.e(t, tProv - 0.2, 0.3);
    const tP = Math.max(tPeq, tSl(0) + 0.45);
    M.ponAp(peq, { x: 165, y: 268 + M.onda(t, 1.5, 3), o: 1 - fueraPeq }, M.aparicion(t, tP, 0.45));
    flechaPeq.poner(M.e(t, tP + 0.2, 0.4)); M.opacidad(flechaPeq.g, t > tP + 0.2 ? 1 - fueraPeq : 0);
    M.ponAp(anillo, { x: SX[4], y: BASE - SS[4] * 50, r: t * 14, s: 1.02 + 0.03 * M.onda(t, 1.2, 1) }, M.aparicion(t, tFue, 0.7));
    M.ponAp(tit1, { x: 640, y: 80, o: 1 - M.e(t, tUna - 0.25, 0.3) }, M.aparicion(t, Math.max(0.2, tMu - 0.6), 0.5, 'sube'));
    ap(tit2, { x: 640, y: 80 + M.onda(t, 2.5, 2) }, t, tUna);
    flechaTam.poner(M.e(t, Math.max(tMun - 0.2, tSl(0) + 0.5), Math.max(1, tUE - tMun), 'inOutQuad'));
    ap(menor, { x: 120, y: 645 }, t, Math.max(tMun - 0.2, tSl(0) + 0.5), 'fundido');
    ap(mayor, { x: 1160, y: 645 }, t, tUE, 'fundido');
  };
});

// ═════════ Escena 3: municipios de la Comunidad de Madrid ═════════
M.escena(3, (E) => {
  const g = E.g;
  const tMun = E.m('Un municipio'), tPue = E.m('un pueblo'), tCiu = E.m('una ciudad'), tMad = E.m('Comunidad de Madrid'), t179 = E.m('179'), tCada = E.m('Cada municipio'), tAyto = E.m('su ayuntamiento');
  // izquierda: la muñeca 1
  const mu = muneca(g, C.ayto);
  const num = insignia(g, 1, C.ayto);
  const rMun = rotNivel(g, 'Municipio', C.ayto, 36);
  const pueblo = M.g(g);
  M.pon(M.icono('casa', pueblo, { color: '#F0D9C4' }), { x: -26, y: 6, s: 0.62 });
  M.pon(M.icono('casa', pueblo, { color: '#E3E8D8', tejado: '#9AA3B5' }), { x: 30, y: 12, s: 0.52 });
  M.pon(M.icono('arbol', pueblo), { x: 4, y: 22, s: 0.36 });
  M.texto(pueblo, 'Pueblo', { tam: 28, peso: 900, y: 70 });
  const ciudad = M.g(g);

  ];

  const items = SERV.map(([ic, txt, clave], k) => {
    const a = ((-108 + 36 * k) * Math.PI) / 180;

    return { it, disco, icg, et, x: CX + RX * Math.cos(a), y: CY + RY * Math.sin(a), t: E.m(clave), ic };
  });
  const lineas = items.map((it) => M.el('path', { d: `M${CX},${CY} L${it.x.toFixed(1)},${it.y.toFixed(1)}`, stroke: C.ayto, 'stroke-width': 4, 'stroke-dasharray': '3 12', 'stroke-linecap': 'round', opacity: 0.8 }, g));
  // las líneas van detrás de todo
  lineas.forEach((l) => g.insertBefore(l, g.firstChild));

  const tit2 = M.rotulo(g, 'La farola: ¡al ayuntamiento!', { tam: 44, fondo: C.tinta });
  const ok = M.marca(g, true, 30);
  const farIdx = 4;

  return (t) => {

    const abre = Math.min(M.e(t, tS - 0.25, 0.3), 1 - M.e(t, tS + 1.1, 0.3, 'inOutQuad'));

    M.pon(sombra, { x: CX, y: CY + 50 * S + 4, o: a.o, s: 1 - salto / 80 });
    M.ponAp(rAy, { x: CX, y: 518 + M.onda(t, 2.4, 2), o: 1 - M.e(t, tCer, 0.4) * 0 }, M.aparicion(t, 0.5, 0.5));
    items.forEach((it, k) => {
      const aa = M.aparicion(t, it.t - 0.25, 0.55);
      const resalta = M.ventana(t, it.t - 0.1, it.t + 0.8, 0.2);
      if (k === farIdx) {
        const mv = M.e(t, tAsi - 0.1, 0.8, 'inOutCubic');
        M.ponAp(it.it, { x: M.lerp(it.x, 1010, mv), y: M.lerp(it.y, 330, mv) + M.onda(t, 2.2, 4, k), s: (1 + 0.12 * resalta) * M.lerp(1, 1.9, mv) }, aa);

  };
});

      const resaltaTres = i === 2 ? M.ventana(t, tTres, tY - 0.2, 0.3) : 0;
      const hl = Math.max(M.ventana(t, tN[i] - 0.1, tN[i] + 0.6, 0.2), resaltaDos, resaltaTres);
      ap(fl.f, { x: 88, y: pos[i] + M.onda(t, 2.6, 2, i) }, t, 0.2 + i * 0.12, 'sube');
      M.opacidad(fl.halo, hl);
      M.pon(fl.m, { s: SS[i] * (1 + 0.15 * hl), y: -brinco(t, tN[i] - 0.1, 10, 0.4), r: M.onda(t, 2.5, 3, i) });
    });
    ap(rPreg, { x: 778, y: 632 }, t, tY, 'sube');
  };
});

M.cabecera({ iconos: ['muneca', 'munecaProv', 'munecaCcaa', 'munecaEstado', 'munecaUE'] });
M.iniciar();
</script>
