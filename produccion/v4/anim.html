<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vídeo 4 · Cómo se vota el 29 de noviembre</title>
<link rel="stylesheet" href="../motor-video/comun.css">
</head>
<body>
<script src="../motor-video/comun.js"></script>
<script src="../motor-video/iconos.js"></script>
<script src="../motor-video/mapas/espana.js"></script>
<script src="../motor-video/datos/v4.js"></script>
<script>
'use strict';
const C = M.C;
const K = C.tinta;
const ap = (el, base, t, t0, tipo = 'pop', dur = 0.55) => M.ponAp(el, base, M.aparicion(t, t0, dur, tipo));
/** Coloca una persona con los pies en (x, pies). */
const ponP = (el, x, pies, s = 1, extra = {}) => M.pon(el, { x, y: pies - 50 * s, s, ...extra });
const bamboleo = (t, i) => ({ dy: M.onda(t, 1.7 + (i % 3) * 0.23, 2.2, i * 1.3), r: M.onda(t, 2.9 + (i % 2) * 0.5, 1.3, i * 2.1) });
/** Miles con punto siempre (es-ES no agrupa los números de 4 cifras: 6667 → «6.667»). */
const miles = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const PARTIDOS = [
  { tipo: 'parque', nombre: 'Los del Parque', corto: 'Parque', color: C.parque },
  { tipo: 'aparcamiento', nombre: 'Los del Aparcamiento', corto: 'Aparcamiento', color: C.aparcamiento },
  { tipo: 'pista', nombre: 'Los de la Pista', corto: 'Pista', color: C.pista },
];
const SEPIA = '#E9D8B4', SEPIA_OSC = '#C9B48A', SEPIA_TXT = '#7A5C3A';
const CAMPANA = '#9D8EC7';
const NOCHE = '#36406A';
const S = (w = 3.5, c = K) => `stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;

// ───────── Iconos propios de este vídeo ─────────
M.registrarIcono('luna', (o) => `<path d="M8,-44 A44,44 0 1 0 44,10 A34,34 0 0 1 8,-44Z" fill="${o.color || '#F6E7A8'}" ${S()}/><circle cx="-20" cy="10" r="5" fill="#E8D88E"/><circle cx="-6" cy="28" r="3.5" fill="#E8D88E"/>`);
M.registrarIcono('escano', (o) => { const c = o.color || C.gris; return `<path d="M-26,24 L-30,48 M26,24 L30,48" ${S(5)}/><rect x="-30" y="-46" width="60" height="58" rx="16" fill="${c}" ${S()}/><rect x="-40" y="4" width="80" height="22" rx="9" fill="${M.oscurece(c, 0.12)}" ${S()}/>`; });
M.registrarIcono('bombo', () => {
  const r = 36; let v = '';
  for (let i = 0; i < 6; i++) { const a = (i * Math.PI) / 6; v += `<path d="M${(r * Math.cos(a)).toFixed(1)},${(r * Math.sin(a)).toFixed(1)} L${(-r * Math.cos(a)).toFixed(1)},${(-r * Math.sin(a)).toFixed(1)}" ${S(2, C.gris)}/>`; }
  const bolas = [[-12, 12, '#F2A65A'], [11, 16, '#8CC0DE'], [0, -2, '#E8A0BF'], [16, -10, '#A3B16B'], [-16, -12, C.estrella]].map(([x, y, c]) => `<circle cx="${x}" cy="${y}" r="8" fill="${c}" ${S(2)}/>`).join('');
  return `<path d="M-32,48 L0,6 L32,48" fill="none" ${S(6, C.grisOsc)}/><g class="jaula"><circle r="${r}" fill="#E8F3F8" ${S(4)}/>${bolas}${v}<circle r="${r}" fill="none" ${S(4)}/></g><circle r="6" fill="${K}"/><path d="M36,0 L48,0 L48,14" fill="none" ${S(5)}/>`;
});
M.registrarIcono('buzon', (o) => `<rect x="-6" y="10" width="12" height="40" rx="3" fill="${C.grisOsc}" ${S(3)}/><path d="M-34,14 L-34,-20 Q-34,-46 0,-46 Q34,-46 34,-20 L34,14Z" fill="${o.color || '#F2A65A'}" ${S()}/><rect x="-20" y="-24" width="40" height="8" rx="4" fill="${K}"/><path d="M-24,0 L24,0" ${S(3)}/>` +
  `<g transform="translate(0 -2) scale(.22)"><rect x="-42" y="-27" width="84" height="54" rx="5" fill="#fff" ${S(8)}/></g>`);
M.registrarIcono('atril', () => `<path d="M-30,-30 L30,-30 L22,48 L-22,48Z" fill="#B8A08A" ${S()}/><rect x="-40" y="-42" width="80" height="16" rx="5" fill="#9C8670" ${S()}/><circle cx="0" cy="6" r="11" fill="${C.estado}" ${S(2.5)}/>`);

// ───────── Utilidades locales ─────────
/** Tarjeta con icono a la izquierda y texto. */
function chip(padre, icono, txt, o = {}) {
  const c = M.g(padre);
  const w = o.ancho || 400, h = o.alto || 80, si = o.sIcono || 0.55;
  M.tarjeta(c, { ancho: w, alto: h, fondo: o.fondo || C.blanco, trazo: o.borde || K, grosor: o.grosor || 4, radio: o.radio === undefined ? 20 : o.radio });
  let x0 = -w / 2 + 22;
  if (icono) {
    const ic = typeof icono === 'function' ? icono(c) : M.icono(icono, c, o.opcIcono || {});
    M.pon(ic, { x: -w / 2 + 18 + 50 * si, s: si });
    x0 = -w / 2 + 18 + 100 * si + 16;
  }
  c.txt = M.texto(c, txt, { tam: o.tam || 28, peso: o.peso || 850, anchor: 'start', x: x0, max: w / 2 - x0 - 16, color: o.color || K });
  return c;
}
/** Etiqueta «Nombre (número)» para los mapas. */
function etiquetaNum(padre, nombre, num, o = {}) {
  const g = M.g(padre);
  const tam = o.tam || 30;
  const wn = M.medir(nombre, tam, 900);
  const R = tam * 0.95;
  const w = wn + 34 + R * 2 + 6, h = tam * 1.7;
  M.el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2, fill: C.blanco, stroke: K, 'stroke-width': 4 }, g);
  M.texto(g, nombre, { tam, peso: 900, anchor: 'start', x: -w / 2 + 18 });
  const circ = M.g(g);
  M.el('circle', { r: R, fill: o.color || K, stroke: C.blanco, 'stroke-width': 3 }, circ);
  M.texto(circ, String(num), { tam: tam * 1.05, peso: 900, color: C.blanco, y: 1 });
  M.pon(circ, { x: w / 2 - R - 6 });
  g.ancho = w; g.alto = h; g.circ = circ; g.cxNum = w / 2 - R - 6;
  return g;
}
/** Pinta asientos con caché (evita tocar el DOM si no cambia). */
function pintor(asientos) {
  const ult = new Array(asientos.length).fill('');
  return (i, col) => { if (ult[i] !== col) { asientos[i].setAttribute('fill', col); ult[i] = col; } };
}
/** Punto de una curva cuadrática. */
const bezier = (a, c, b, p) => ({ x: (1 - p) * (1 - p) * a[0] + 2 * (1 - p) * p * c[0] + p * p * b[0], y: (1 - p) * (1 - p) * a[1] + 2 * (1 - p) * p * c[1] + p * p * b[1] });
// Escaños 2023 (sirven solo para el tono del mapa; en pantalla solo se ven Madrid 38, Barcelona 32, Soria 2, Ceuta 1 y Melilla 1).
const ESCANOS = { '01': 4, '02': 4, '03': 12, '04': 6, '05': 3, '06': 5, '07': 8, '08': 32, '09': 4, '10': 4, '11': 9, '12': 5, '13': 5, '14': 6, '15': 8, '16': 3, '17': 6, '18': 7, '19': 3, '20': 6, '21': 5, '22': 3, '23': 5, '24': 4, '25': 4, '26': 4, '27': 4, '28': 38, '29': 11, '30': 10, '31': 5, '32': 4, '33': 7, '34': 3, '35': 8, '36': 7, '37': 4, '38': 7, '39': 5, '40': 3, '41': 12, '42': 2, '43': 6, '44': 3, '45': 6, '46': 16, '47': 5, '48': 8, '49': 3, '50': 7, '51': 1, '52': 1 };
const ISLAS = ['07', '35', '38', '51', '52'];
/** Papeleta del Congreso (lista cerrada de un partido). */
function papeletaCongreso(padre, p) {
  const g = M.g(padre); const W = 210, H = 320;
  M.el('rect', { x: -W / 2, y: -H / 2, width: W, height: H, rx: 10, fill: '#fff', stroke: K, 'stroke-width': 4 }, g);
  M.texto(g, 'CONGRESO', { tam: 24, peso: 900, y: -H / 2 + 28, color: C.grisOsc, espaciado: 1 });
  M.el('path', { d: `M${-W / 2 + 14},${-H / 2 + 52} L${W / 2 - 14},${-H / 2 + 52}`, stroke: C.grisClaro, 'stroke-width': 3 }, g);
  M.pon(M.icono('logo', g, { tipo: p.tipo }), { y: -H / 2 + 102, s: 0.7 });
  M.texto(g, p.corto, { tam: p.corto.length > 8 ? 24 : 28, peso: 900, y: -H / 2 + 166 });
  for (let i = 0; i < 4; i++) { const y = -H / 2 + 204 + i * 28; M.el('circle', { cx: -W / 2 + 30, cy: y, r: 4, fill: K }, g); M.el('rect', { x: -W / 2 + 42, y: y - 5, width: [130, 110, 140, 100][i], height: 10, rx: 5, fill: C.grisClaro }, g); }
  return g;
}
/** Papeleta del Senado (sepia, nombres con casillas). */
function papeletaSenado(padre) {
  const g = M.g(padre); const W = 320, H = 400;
  M.el('rect', { x: -W / 2, y: -H / 2, width: W, height: H, rx: 10, fill: SEPIA, stroke: K, 'stroke-width': 4 }, g);
  M.texto(g, 'SENADO', { tam: 26, peso: 900, y: -H / 2 + 30, color: SEPIA_TXT, espaciado: 1 });
  M.el('path', { d: `M${-W / 2 + 14},${-H / 2 + 56} L${W / 2 - 14},${-H / 2 + 56}`, stroke: SEPIA_OSC, 'stroke-width': 3 }, g);
  const casillas = []; let y = -H / 2 + 84;
  PARTIDOS.forEach((pt, k) => {
    M.pon(M.icono('logo', g, { tipo: pt.tipo }), { x: -W / 2 + 36, y, s: 0.36 });
    M.texto(g, pt.corto, { tam: 24, peso: 900, anchor: 'start', x: -W / 2 + 64, y, color: SEPIA_TXT });
    y += 36;
    for (let j = 0; j < 2; j++) {
      const bx = -W / 2 + 26;
      const caja = M.el('rect', { x: bx, y: y - 12, width: 24, height: 24, rx: 4, fill: '#fff', stroke: K, 'stroke-width': 3 }, g);
      M.el('rect', { x: bx + 40, y: y - 5, width: [170, 140, 190, 150, 160, 130][k * 2 + j], height: 10, rx: 5, fill: SEPIA_OSC }, g);
      const tick = M.el('path', { d: `M${bx + 4},${y} L${bx + 10},${y + 7} L${bx + 22},${y - 10}`, fill: 'none', stroke: C.ok, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
      casillas.push({ caja, tick, x: bx + 12, y });
      y += 32;
    }
    y += 10;
  });
  g.casillas = casillas;
  return g;
}

// ───────── Escena 1: un colegio electoral un domingo ─────────
M.escena(1, (E) => {
  const g = E.g;
  const cam = M.g(g);
  const nubes = [[150, 95, 1.0], [560, 58, 0.8], [990, 100, 1.1], [1350, 70, 0.9]].map(([x, y, s]) => ({ el: M.icono('nube', cam), x, y, s }));
  M.el('rect', { x: -100, y: 590, width: 1480, height: 400, fill: C.arena }, cam);
  M.el('path', { d: 'M-100,590 L1380,590', stroke: C.arenaOsc, 'stroke-width': 6 }, cam);
  [[95, 1.35], [1195, 1.45]].forEach(([x, s]) => M.pon(M.icono('arbol', cam), { x, y: 590 - 48 * s, s }));
  // el colegio
  const COL = '#F2D6B3', TEJ = '#C47A6A';
  const cole = M.g(cam);
  M.el('rect', { x: 320, y: 300, width: 640, height: 290, rx: 6, fill: COL, stroke: K, 'stroke-width': 5 }, cole);
  M.el('path', { d: 'M530,296 L640,212 L750,296Z', fill: TEJ, stroke: K, 'stroke-width': 5, 'stroke-linejoin': 'round' }, cole);
  M.el('rect', { x: 306, y: 284, width: 668, height: 22, rx: 6, fill: TEJ, stroke: K, 'stroke-width': 5 }, cole);
  const relojF = M.icono('reloj', cole); M.pon(relojF, { x: 640, y: 262, s: 0.36 }); M.ponHora(relojF, 9, 0);
  for (const x of [352, 444, 772, 864]) for (const y of [326, 416]) {
    M.el('rect', { x, y, width: 64, height: 58, rx: 6, fill: '#E8F3F8', stroke: K, 'stroke-width': 4 }, cole);
    M.el('path', { d: `M${x + 32},${y} L${x + 32},${y + 58} M${x},${y + 29} L${x + 64},${y + 29}`, stroke: K, 'stroke-width': 3 }, cole);
  }
  M.el('rect', { x: 588, y: 470, width: 104, height: 120, rx: 6, fill: TEJ, stroke: K, 'stroke-width': 5 }, cole);
  M.el('path', { d: 'M640,474 L640,590', stroke: K, 'stroke-width': 4 }, cole);
  M.el('rect', { x: 560, y: 428, width: 160, height: 34, rx: 8, fill: C.blanco, stroke: K, 'stroke-width': 3 }, cole);
  M.texto(cole, 'COLEGIO', { tam: 24, peso: 900, x: 640, y: 446, espaciado: 2 });
  // cartel «Colegio electoral» colgado
  const cartel = M.g(cam);
  M.el('path', { d: 'M-150,-34 L-170,-82 M150,-34 L170,-82', stroke: K, 'stroke-width': 3 }, cartel);
  const rCartel = M.rotulo(cartel, 'Colegio electoral', { tam: 42, fondo: C.estado, borde: K, grosor: 4, pad: 30 });
  // gente que entra
  const tLlenos = E.m('abrirán sus puertas');
  const P = 6.6, W = 5.0;
  const walkers = M.gente(11, 404).map((o, i) => ({ el: M.persona(cam, o), lado: i % 2 ? 1 : -1, t0: i < 2 ? 0.15 + i * 1.4 : tLlenos - 0.6 + (i - 2) * 0.62, carril: i % 3 }));
  // calendario, sin clase
  const cal = M.icono('calendario', g, { mes: 'NOV', dia: 29, color: C.estado });
  const rDom = M.rotulo(g, 'Domingo', { tam: 30, fondo: C.estado });
  const sinClase = M.g(g);
  M.pon(M.icono('libroAbierto', sinClase), { s: 1.05 });
  const cruz = M.marca(sinClase, false, 24); M.pon(cruz, { x: 44, y: -34 });
  const rSin = M.rotulo(sinClase, 'Sin clase', { tam: 30, fondo: C.error }); M.pon(rSin, { y: 78 });
  // elecciones generales: Congreso y Senado
  const rGen = M.rotulo(g, 'Elecciones generales', { tam: 46, fondo: K, pad: 30 });
  const camara = (icono, nombre) => { const c = M.g(g); M.pon(M.icono(icono, c, { acento: C.estado, tejado: C.estado }), { s: 1.15 }); const r = M.rotulo(c, nombre, { tam: 32, fondo: C.estado }); M.pon(r, { y: 92 }); return c; };
  const congreso = camara('cupula', 'Congreso'), senado = camara('edificio', 'Senado');
  // el camino de un voto
  const voto = M.icono('papeleta', g);
  const A = [1070, 430], Q = [900, 300], B = [640, 540];
  const camino = M.flecha(g, { x1: A[0], y1: A[1], x2: B[0] + 40, y2: B[1] - 20, curva: -70, color: C.estado, grosor: 6, discontinua: true });
  const tDom = E.m('domingo 29'), tClase = E.m('no para dar clase'), tElec = E.m('colegios electorales'), tGen = E.m('elecciones generales');
  const tCong = E.m('el Congreso'), tSen = E.m('el Senado'), tCam = E.m('camino de un voto');
  return (t, d) => {
    M.camara(cam, t, d, { hasta: 1.04, cy: 560 });
    nubes.forEach((n, i) => M.pon(n.el, { x: ((n.x + t * (7 + i * 2)) % 1500) - 80, y: n.y, s: n.s }));
    walkers.forEach((w, i) => {
      if (t < w.t0) { M.opacidad(w.el, 0); return; }
      const u = ((t - w.t0) % P) / W;
      if (u > 1) { M.opacidad(w.el, 0); return; }
      const x0 = w.lado < 0 ? -70 - w.carril * 30 : 1350 + w.carril * 30;
      const xf = 640 + w.lado * (12 + w.carril * 8);
      const x = M.lerp(x0, xf, Math.min(1, u / 0.8));
      const sub = M.ease.inOutQuad(M.clamp((u - 0.62) / 0.38));
      const pies = M.lerp(662 - w.carril * 10, 596, sub);
      const s = M.lerp(1.15, 0.86, sub);
      const o = Math.min(M.clamp(u * 8), 1 - M.clamp((u - 0.86) / 0.14));
      ponP(w.el, x, pies - Math.abs(M.onda(t, 0.55, 5, i)), s, { r: M.onda(t, 0.55, 3, i), o });
    });
    // cartel
    const caeC = M.e(t, tElec - 0.2, 0.9, 'outBounce');
    M.pon(cartel, { x: 640, y: M.lerp(150, 382, caeC), r: M.onda(t, 2.4, 1.6) * (caeC >= 1 ? 1 : 0), o: t > tElec - 0.2 ? 1 : 0 });
    M.pon(rCartel, { s: 1 + 0.06 * M.ventana(t, tElec + 0.8, tElec + 1.6, 0.3) });
    // calendario / sin clase → generales
    const fuera = M.e(t, tGen - 0.4, 0.4);
    M.ponAp(cal, { x: 160, y: 150 + M.onda(t, 2.6, 4), s: 1.45, r: M.onda(t, 3, 2), o: 1 - fuera }, M.aparicion(t, Math.min(0.2, tDom), 0.55));
    M.ponAp(rDom, { x: 160, y: 250, o: 1 - fuera }, M.aparicion(t, tDom + 0.1, 0.5));
    M.ponAp(sinClase, { x: 1120, y: 150 + M.onda(t, 2.6, 4, 1), o: 1 - fuera }, M.aparicion(t, tClase - 0.1, 0.55));
    M.pon(cruz, { x: 44, y: -34, s: M.e(t, tClase + 0.35, 0.4, 'outBack') });
    ap(rGen, { x: 640, y: 72 + M.onda(t, 3, 2) }, t, tGen - 0.15, 'sube');
    ap(congreso, { x: 165, y: 165 + M.onda(t, 2.8, 4) }, t, tCong - 0.1);
    ap(senado, { x: 1115, y: 165 + M.onda(t, 2.8, 4, 1) }, t, tSen - 0.1);
    // papeleta que sigue el camino
    camino.poner(M.e(t, tCam - 0.2, 1.1, 'inOutQuad'));
    const pv = M.e(t, tCam + 0.3, 1.6, 'inOutCubic');
    const pt = bezier(A, Q, B, pv);
    M.ponAp(voto, { x: pt.x, y: pt.y + M.onda(t, 1.2, 4) * (1 - pv), s: 1.1 - 0.5 * pv, r: M.onda(t, 1.6, 8) * (1 - pv), o: 1 - M.e(t, tCam + 1.75, 0.3) }, M.aparicion(t, tCam - 0.3, 0.5));
  };
});

// ───────── Escena 2: calendario de noviembre ─────────
M.escena(2, (E) => {
  const g = E.g;
  const CX = 345, CY = 352;
  const cal = M.calendarioMes(g, { anio: 2026, mes: 11, ancho: 490, color: C.grisOsc });
  const tCamp = E.m('campaña electoral'), tDel = E.m('del 13 al 27'), tProp = E.m('explican sus propuestas');
  const t28 = E.m('sábado 28'), tRef = E.m('jornada de reflexión'), tNoC = E.m('ya no se hace campaña'), tCalma = E.m('piense con calma');
  const t29 = E.m('domingo 29'), tVota = E.m('se vota');
  const campClaro = M.aclara(CAMPANA, 0.45);
  for (let d = 13; d <= 27; d++) { cal.dias[d].fondo.setAttribute('fill', campClaro); cal.dias[d].fondo.setAttribute('opacity', 0); }
  cal.dias[28].fondo.setAttribute('fill', '#BCC3CF'); cal.dias[28].fondo.setAttribute('opacity', 0);
  cal.dias[29].fondo.setAttribute('fill', C.estado); cal.dias[29].fondo.setAttribute('opacity', 0);
  const aro = M.el('circle', { r: cal.celda * 0.58, fill: 'none', stroke: C.estado, 'stroke-width': 6 }, cal.dias[29].g);
  const urnita = M.icono('urna', g, { papeletas: 3 });
  // tarjetas
  const W = 560, H = 140, X = 940;
  const tarjeta = (icono, titulo, sub, borde, fondo, opc = {}) => {
    const c = M.g(g);
    M.tarjeta(c, { ancho: W, alto: H, fondo, trazo: borde, grosor: 6, radio: 26 });
    const ic = M.icono(icono, c, opc); M.pon(ic, { x: -W / 2 + 70, s: 0.9 });
    M.texto(c, titulo, { tam: 42, peso: 900, anchor: 'start', x: -W / 2 + 140, y: -22 });
    M.texto(c, sub, { tam: 32, peso: 850, anchor: 'start', x: -W / 2 + 140, y: 28, color: C.grisOsc });
    c.ic = ic;
    return c;
  };
  const tCampana = tarjeta('megafono', 'Campaña', '13 – 27 nov', CAMPANA, M.aclara(CAMPANA, 0.85));
  const logos = PARTIDOS.map((p) => M.icono('logo', tCampana, { tipo: p.tipo }));
  const tReflex = tarjeta('pensar', 'Reflexión', 'sábado 28', C.gris, '#F1F3F6');
  const noMeg = M.g(tReflex); M.pon(M.icono('megafono', noMeg), { s: 0.55 }); const xNo = M.marca(noMeg, false, 18); M.pon(xNo, { x: 22, y: -20 });
  const tVot = tarjeta('urna', 'Votación', 'domingo 29', C.estado, M.aclara(C.estado, 0.85), { papeletas: 2 });
  const pap = M.icono('papeleta', tVot);
  const d29 = cal.dias[29];
  return (t) => {
    ap(cal.g, { x: CX, y: CY }, t, 0.1, 'sube');
    for (let d = 13; d <= 27; d++) {
      const t0 = tDel + (d - 13) * 0.1;
      M.opacidad(cal.dias[d].fondo, M.e(t, t0, 0.3));

    const fq = M.e(t, tInv - 0.3, 0.3);
    M.ponAp(rQ, { x: HEM.cx, y: 62, o: 1 - fq }, M.aparicion(t, Math.min(0.2, tQuien), 0.5, 'sube'));
    ap(rInv, { x: HEM.cx, y: 62, s: 1 + 0.03 * M.onda(t, 1.4, 1) }, t, tInv - 0.1, 'sube');
    ap(atril, { x: HEM.cx, y: 505, s: 0.95 }, t, tVota - 0.1, 'sube');
    ap(cand, { x: HEM.cx, y: 446 - 50, s: 1.0, ...bamboleo(t, 1) }, t, tPres - 0.3, 'sube');
    ap(interr, { x: HEM.cx + 58, y: 380 + M.onda(t, 1.6, 4), s: 0.42, r: M.onda(t, 1.2, 8) }, t, tPres);
    // tarjetas
    ap(c1, { x: TX, y: 200 + M.onda(t, 3, 2) }, t, t1 - 0.2, 'sube');
    M.opacidad(tMayAbs, M.e(t, tMay - 0.1, 0.4));
    M.ponTexto(n176, String(nMay));
    n176.setAttribute('fill', nMay >= 176 ? C.estado : K);
    M.opacidad(de350, M.e(t, t176, 0.4));
    ap(c2, { x: TX, y: 470 + M.onda(t, 3, 2, 1) }, t, t2 - 0.3, 'sube');
    M.pon(fSi, { y: 6 }); M.pon(fNo, { y: 62 });
    bSi.setAttribute('width', (130 * M.e(t, tSies - 0.2, 0.8)).toFixed(1));
    bNo.setAttribute('width', (114 * M.e(t, tSies, 0.8)).toFixed(1));
    M.opacidad(nSi, M.e(t, tSies + 0.5, 0.3)); M.opacidad(nNo, M.e(t, tSies + 0.7, 0.3));
    ap(okSi, { x: 150, y: -100 }, t, tSies + 1.0, 'pop', 0.45);
  };
});

// ───────── Escena 12: pacto y «para y piensa» ─────────
M.escena(12, (E) => {
  const g = E.g;
  const tSolo = E.m('llega solo'), tAc = E.m('ponerse de acuerdo'), tSum = E.m('sumar'), tPac = E.m('un pacto'), tPara = E.m('Para el vídeo'), tMad = E.m('Madrid'), tSor = E.m('Soria');
  const fase1 = M.g(g), fase2 = M.g(g);
  // fase 1: hemiciclo y pacto
  const hem = M.hemiciclo(fase1, { n: 350, ...HEM, color: C.grisClaro });
  const pinta = pintor(hem.asientos);
  const aM = (hem.pos[175].a + hem.pos[176].a) / 2;
  const r0 = HEM.rInt - 22, r1 = HEM.rExt + 26;
  M.el('path', { d: `M${(HEM.cx + r0 * Math.cos(aM)).toFixed(1)},${(HEM.cy - r0 * Math.sin(aM)).toFixed(1)} L${(HEM.cx + r1 * Math.cos(aM)).toFixed(1)},${(HEM.cy - r1 * Math.sin(aM)).toFixed(1)}`, stroke: K, 'stroke-width': 6, 'stroke-dasharray': '4 10', 'stroke-linecap': 'round' }, fase1);
  const er = HEM.rExt + 42;
  const et176 = M.rotulo(fase1, '176', { tam: 34, fondo: K }); M.pon(et176, { x: HEM.cx + er * Math.cos(aM), y: HEM.cy - er * Math.sin(aM) + 4 });
  const A = PARTIDOS[1], B = PARTIDOS[2];
  const NA = 120, NB = 80, B0 = 240; // B ocupa al principio 240…319
  const rPacto = M.rotulo(fase1, 'Pacto', { tam: 54, fondo: C.estado, pad: 40 });
  const TX = 1060;
  const tarjeta = (p, n) => { const c = M.g(fase1); M.tarjeta(c, { ancho: 320, alto: 96, trazo: p.color, grosor: 5 }); M.pon(M.icono('logo', c, { tipo: p.tipo }), { x: -110, s: 0.62 }); M.texto(c, p.corto, { tam: 26, peso: 900, anchor: 'start', x: -64, y: -16 }); M.texto(c, `${n} diputados`, { tam: 26, peso: 800, anchor: 'start', x: -64, y: 18, color: C.grisOsc }); c.no = M.marca(c, false, 20); M.pon(c.no, { x: 150, y: -40 }); return c; };
  const cA = tarjeta(A, NA), cB = tarjeta(B, NB);
  const mas = M.texto(fase1, '+', { tam: 56, peso: 900 });
  const suma = M.g(fase1);
  M.tarjeta(suma, { ancho: 320, alto: 96, fondo: M.aclara(C.ok, 0.85), trazo: C.ok, grosor: 5 });
  M.texto(suma, '200 ≥ 176', { tam: 40, peso: 900, x: -14 });
  const okS = M.marca(suma, true, 24); M.pon(okS, { x: 124 });
  // fase 2: para y piensa
  const cab = M.g(fase2);
  M.pon(M.icono('pausa', cab), { x: -215, s: 0.8 });
  M.texto(cab, 'Para y piensa', { tam: 54, peso: 900, x: 40 });
  const fit = M.mapas.encajar(1000, 921, { x: 50, y: 125, w: 640, h: 530 });
  const mapaG = M.g(fase2);
  const mapa = M.mapas.espana(mapaG, { modo: 'provincias', relleno: '#F3EBDA', trazo: '#fff', grosor: 2 });
  const scr = (id) => { const [x, y] = mapa.punto(id); return [fit.x + x * fit.s, fit.y + y * fit.s]; };
  const et = [['28', 'Madrid', 38, [205, 395], tMad], ['42', 'Soria', 2, [530, 175], Math.min(tSor, tMad + 0.9)]].map(([id, nom, n, pos, t0]) => {
    const [px, py] = scr(id);
    const linea = M.el('path', { d: `M${pos[0]},${pos[1]} L${px.toFixed(1)},${py.toFixed(1)}`, stroke: K, 'stroke-width': 3.5 }, fase2);
    const dot = M.el('circle', { cx: px, cy: py, r: 7, fill: K }, fase2);
    const e = etiquetaNum(fase2, nom, n, { tam: 34, color: C.estado });
    return { id, linea, dot, e, pos, t0 };
  });
  const bur = M.bocadillo(fase2, { ancho: 470, alto: 250, colaX: -60, colaY: 200, pensamiento: true });
  M.texto(bur.contenido, '¿Por qué Madrid elige muchos más diputados que Soria?', { tam: 34, peso: 900, max: 400 });
  const pensador = M.persona(fase2, { ...M.gente(1, 8)[0], brazoD: -150 });
  return (t) => {
    const f1 = M.e(t, tPara - 0.1, 0.35), f2 = M.e(t, tPara + 0.25, 0.4);
    M.opacidad(fase1, 1 - f1);
    M.opacidad(fase2, f2);
    if (f1 < 1) {
      const mover = M.e(t, tSum - 0.1, 1.4, 'inOutQuad');
      const nMov = Math.floor(NB * mover);
      hem.asientos.forEach((_, i) => {
        let col = C.grisClaro;
        if (i < NA) col = A.color;
        else if (i >= NA && i < NA + nMov) col = B.color;
        else if (i >= B0 + nMov && i < B0 + NB) col = B.color;
        pinta(i, col);
      });
      ap(cA, { x: TX, y: 150 + M.onda(t, 3, 2) }, t, 0.2, 'sube');
      ap(cB, { x: TX, y: 330 + M.onda(t, 3, 2, 1) }, t, 0.4, 'sube');
      [cA, cB].forEach((c, i) => M.pon(c.no, { x: 150, y: -40, s: M.e(t, tSolo + i * 0.2, 0.4, 'outBack') * (1 - M.e(t, tPac, 0.3)) }));
      ap(mas, { x: TX, y: 240 }, t, tAc);
      ap(suma, { x: TX, y: 480 + M.onda(t, 3, 2, 2) }, t, tSum + 0.4, 'sube');
      M.pon(okS, { x: 124, s: M.e(t, tPac, 0.4, 'outBack') });
      ap(rPacto, { x: HEM.cx, y: 62, s: 1 + 0.04 * M.onda(t, 1.2, 1) }, t, tPac - 0.1, 'sube');
    }
    if (f2 > 0) {
      ap(cab, { x: 640, y: 70 }, t, tPara + 0.25, 'sube');
      M.pon(mapaG, { x: fit.x, y: fit.y, s: fit.s });
      et.forEach((q) => {
        q.linea.setAttribute('stroke-dasharray', '400'); q.linea.setAttribute('stroke-dashoffset', (400 * (1 - M.e(t, q.t0, 0.4))).toFixed(1)); M.opacidad(q.linea, t > q.t0 ? 1 : 0);
        M.opacidad(q.dot, M.e(t, q.t0, 0.3));
        mapa.provincias[q.id].setAttribute('fill', M.mezcla('#F3EBDA', C.prov, M.e(t, q.t0 - 0.1, 0.4)));
        ap(q.e, { x: q.pos[0], y: q.pos[1] + M.onda(t, 2.4, 3, q.t0) }, t, q.t0);
      });
      ap(bur, { x: 985, y: 285 + M.onda(t, 3, 4) }, t, tPara + 0.8);
      ap(pensador, { x: 905, y: 645 - 65, s: 1.3, ...bamboleo(t, 2) }, t, tPara + 0.4, 'sube');
    }
  };
});

// ───────── Escena 13: repaso con el hemiciclo ─────────
M.escena(13, (E) => {
  const g = E.g;
  const tRep = E.m('Repasamos'), tU = E.m('uno:'), tD = E.m('dos:'), tT = E.m('tres:'), tY = E.m('Y ahora');
  const tit = M.texto(g, 'Repasamos', { tam: 52, peso: 900 });
  const COLS = [C.estado, C.prov, C.ok];
  const ICON = ['urna', 'escano', 'atril'];
  const X0 = 40, AN = 870, TAM = 31;
  const tarjetas = E.datos.ideas.map((idea, i) => {
    const c = M.g(g);
    const txt = M.texto(null, idea, { tam: TAM, peso: 750, max: AN - 150 });
    const h = Math.max(104, txt.alto + 34);
    M.el('rect', { x: 0, y: -h / 2, width: AN, height: h, rx: 22, fill: C.blanco, stroke: COLS[i], 'stroke-width': 6 }, c);
    M.el('circle', { cx: 58, cy: 0, r: 34, fill: COLS[i] }, c);
    M.texto(c, String(i + 1), { tam: 42, peso: 900, x: 58, y: 2, color: i === 1 ? K : C.blanco });
    M.texto(c, idea, { tam: TAM, peso: 750, max: AN - 150, anchor: 'start', x: 116 });
    return { c, h };
  });
  const hem = M.hemiciclo(g, { n: 350, cx: 0, cy: 0, rInt: 56, rExt: 150, filas: 8, color: C.grisClaro });
  const pinta = pintor(hem.asientos);
  const aM = (hem.pos[175].a + hem.pos[176].a) / 2;
  const linea = M.el('path', { d: `M${(40 * Math.cos(aM)).toFixed(1)},${(-40 * Math.sin(aM)).toFixed(1)} L${(170 * Math.cos(aM)).toFixed(1)},${(-170 * Math.sin(aM)).toFixed(1)}`, stroke: K, 'stroke-width': 5, 'stroke-dasharray': '3 8', 'stroke-linecap': 'round' }, hem.g);
  const n350 = M.texto(g, '350 diputados', { tam: 32, peso: 900 });
  const r176 = M.rotulo(g, 'Mayoría: 176', { tam: 30, fondo: C.estado });
  const rPreg = M.rotulo(g, '¡Ahora, unas preguntas!', { tam: 34, fondo: C.ok });
  const totalH = tarjetas.reduce((a, c) => a + c.h, 0) + 18 * (tarjetas.length - 1);
  const Y0 = Math.max(112, 112 + (478 - totalH) / 2);
  return (t) => {
    ap(tit, { x: X0 + AN / 2, y: 66 }, t, Math.max(0.05, tRep - 0.3), 'sube');
    let y = Y0;
    tarjetas.forEach((c, i) => { M.ponAp(c.c, { x: X0 + M.onda(t, 6, 3, i), y: y + c.h / 2 }, M.aparicion(t, [tU, tD, tT][i], 0.6, 'sube')); y += c.h + 18; });
    ap(hem.g, { x: 1078, y: 360 }, t, 0.2, 'fundido');
    const lleno = Math.floor(350 * M.e(t, 0.3, 2.2, 'inOutQuad'));
    const may = Math.floor(176 * M.e(t, tT + 0.4, 1.4, 'inOutQuad'));
    hem.asientos.forEach((_, i) => pinta(i, i < may ? C.estado : i < lleno ? '#B9BFCC' : C.grisClaro));
    M.opacidad(linea, M.e(t, tT + 0.3, 0.4));
    ap(n350, { x: 1078, y: 405 }, t, 0.6, 'fundido');
    ap(r176, { x: 1078, y: 470 + M.onda(t, 2.4, 3) }, t, tT + 0.8);
    ap(rPreg, { x: 640, y: 628 }, t, tY, 'sube');
  };
});

M.cabecera({ iconos: ['calendario', 'dni', 'papeleta', 'urna'] });
M.iniciar();
</script>
