<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vídeo 5 · La Unión Europea</title>

<script>
'use strict';
const C = M.C;
const K = C.tinta;
const UE = C.ue, ORO = C.estrella;
const ap = (el, base, t, t0, tipo = 'pop', dur = 0.55) => M.ponAp(el, base, M.aparicion(t, t0, dur, tipo));
/** Coloca una persona con los pies en (x, pies). */
const ponP = (el, x, pies, s = 1, extra = {}) => M.pon(el, { x, y: pies - 50 * s, s, ...extra });
const bamboleo = (t, i) => ({ dy: M.onda(t, 1.7 + (i % 3) * 0.23, 2.2, i * 1.3), r: M.onda(t, 2.9 + (i % 2) * 0.5, 1.3, i * 2.1) });
const SW = (w = 3.5, c = K) => `stroke="${c}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const txtSvg = (s, x, y, tam, color = K, peso = 900) => `<text x="${x}" y="${y}" font-size="${tam}" font-weight="${peso}" fill="${color}" text-anchor="middle" dominant-baseline="central">${s}</text>`;
/** Icono reflejado en horizontal (M.pon no admite escalas negativas). */
const espejo = (nombre, padre, o = {}) => { const g = M.g(padre); M.icono(nombre, M.g(g, { transform: 'scale(-1 1)' }), o); return g; };
/** Desaparición: 1 → 0 a partir de t0. */
const fuera = (t, t0, dur = 0.4) => 1 - M.e(t, t0, dur);

// ───────── Estrella de 5 puntas regular (una punta hacia arriba) ─────────
const estrella5 = (cx, cy, r, fill, extra = '') => {
  let d = '';
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5; const rr = i % 2 ? r * 0.382 : r; d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(2) + ',' + (cy + rr * Math.sin(a)).toFixed(2); }
  return `<path d="${d}Z" fill="${fill}" ${extra}/>`;
};

/**
 * Bandera de la UE dibujada según su diseño: proporción 3:2, 12 estrellas doradas de 5 puntas,
 * en círculo de radio = 1/3 de la altura, cada estrella de radio = 1/18 de la altura, todas derechas,
 * en la posición de las horas de un reloj. Centrada en (0,0).
 */
function bandera(padre, h, o = {}) {
  const w = h * 1.5; const g = M.g(padre);
  const fondo = M.el('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: Math.max(3, h * 0.025), fill: UE, stroke: o.trazo || K, 'stroke-width': o.grosor === undefined ? 4 : o.grosor }, g);
  const R = h / 3, r = h / 18;
  const estrellas = [];
  for (let i = 0; i < 12; i++) {
    const a = (i * Math.PI) / 6; const x = R * Math.sin(a), y = -R * Math.cos(a);
    const sg = M.svg(g, estrella5(0, 0, r, ORO));
    M.pon(sg, { x, y });
    estrellas.push({ g: sg, x, y });
  }
  return { g, w, h, R, r, estrellas, fondo };
}
M.registrarIcono('banderaUEv5', () => { const h = 60, w = 90; let e = ''; for (let i = 0; i < 12; i++) { const a = (i * Math.PI) / 6; e += estrella5(20 * Math.sin(a), -20 * Math.cos(a), h / 18, ORO); } return `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="4" fill="${UE}" ${SW(3)}/>${e}`; });

// ───────── Muñeca rusa que se abre (dos mitades) ─────────
const MUN_D = 'M0,-50 Q-24,-50 -26,-24 Q-27,-14 -22,-8 Q-38,10 -36,30 Q-34,50 0,50 Q34,50 36,30 Q38,10 22,-8 Q27,-14 26,-24 Q24,-50 0,-50Z';
let clipsMun = false;
function munecaPartida(padre, color, opc = {}) {
  if (!clipsMun) {
    clipsMun = true;
    M.el('rect', { x: -70, y: -70, width: 140, height: 70.6 }, M.el('clipPath', { id: 'v5-mun-arriba', clipPathUnits: 'userSpaceOnUse' }, M.defs));
    M.el('rect', { x: -70, y: 0, width: 140, height: 70 }, M.el('clipPath', { id: 'v5-mun-abajo', clipPathUnits: 'userSpaceOnUse' }, M.defs));
    M.el('path', { d: MUN_D }, M.el('clipPath', { id: 'v5-mun-cuerpo', clipPathUnits: 'userSpaceOnUse' }, M.defs));
  }
  const g = M.g(padre);
  const abajo = M.g(g);
  M.icono('muneca', M.g(abajo, { 'clip-path': 'url(#v5-mun-abajo)' }), { color, ...opc });
  const hueco = M.el('ellipse', { cx: 0, cy: 0, rx: 30, ry: 5, fill: M.oscurece(color, 0.45) }, abajo);
  M.el('path', { d: 'M-40,0 L40,0', stroke: M.oscurece(color, 0.35), 'stroke-width': 3, 'clip-path': 'url(#v5-mun-cuerpo)' }, abajo);
  const arriba = M.g(g);
  M.icono('muneca', M.g(arriba, { 'clip-path': 'url(#v5-mun-arriba)' }), { color, ...opc });
  return {
    g, arriba, abajo,
    /** p: 0 cerrada … 1 abierta (la mitad de arriba sube y se inclina). */
    abrir(p) { M.pon(arriba, { y: -p * 40, x: p * 8, r: -p * 16 }); M.opacidad(hueco, p > 0.02 ? 1 : 0); },
  };
}
M.registrarIcono('munecaUE', () => M.iconos.muneca({ color: UE, texto: 'UE', tamTexto: 15 }));

// ───────── Mapa de Europa recortado ─────────
let nRec = 0;
const EUROPA = window.MAPA_EUROPA;
const datosPais = (id) => EUROPA.paises.find((p) => p.id === id);
function mapaEuropa(padre, opc = {}) {
  const ext = M.g(padre);
  const id = 'v5-rec-eu-' + (++nRec);
  M.el('rect', { width: 1000, height: 820, rx: 20 }, M.el('clipPath', { id }, M.defs));
  const interior = M.g(ext, { 'clip-path': `url(#${id})` });
  const m = M.mapas.europa(interior, opc);
  M.el('rect', { width: 1000, height: 820, rx: 20, fill: 'none', stroke: C.gris, 'stroke-width': 3 }, ext);
  m.ext = ext; m.interior = interior; m.capa = M.g(ext);
  return m;
}
/** Escala un país alrededor de su etiqueta (para el «pop» al colorearlo). */
const popPais = (p, k) => p.path.setAttribute('transform', k === 1 ? '' : `translate(${p.et[0]} ${p.et[1]}) scale(${k.toFixed(3)}) translate(${-p.et[0]} ${-p.et[1]})`);
/** Silueta de un país (de europa.js) centrada en (0,0) con altura `alto`. */
function silueta(padre, id, alto, color, trazo = K) {
  const p = datosPais(id); const [x, y, w, h] = p.caja; const s = alto / h;
  const g = M.g(padre); const inner = M.g(g, { transform: `scale(${s.toFixed(4)}) translate(${(-(x + w / 2)).toFixed(1)} ${(-(y + h / 2)).toFixed(1)})` });
  M.el('path', { d: p.d, fill: color, stroke: trazo, 'stroke-width': (3 / s).toFixed(2), 'stroke-linejoin': 'round' }, inner);
  g.ancho = w * s; g.alto = alto;
  return g;
}

// ───────── Monedas de euro genéricas (motivos inventados) ─────────
const METAL = { oro: '#E2B650', plata: '#D3D9E2', cobre: '#C7804F' };
const MOTIVOS = {
  arbol: (c) => `<circle cx="0" cy="-7" r="13" fill="${c}"/><circle cx="-11" cy="1" r="9" fill="${c}"/><circle cx="11" cy="1" r="9" fill="${c}"/><rect x="-3" y="2" width="6" height="18" rx="2" fill="${c}"/>`,
  barco: (c) => `<path d="M-21,5 L21,5 L13,16 L-13,16Z" fill="${c}"/><path d="M-1,2 L-1,-21 L15,0Z" fill="${c}"/><path d="M-5,0 L-5,-14 L-17,0Z" fill="${c}"/><path d="M-22,22 Q-16,18 -10,22 Q-4,26 2,22 Q8,18 14,22 Q18,25 22,22" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`,
  castillo: (c) => `<path d="M-20,20 L-20,-6 L-20,-14 L-14,-14 L-14,-8 L-8,-8 L-8,-14 L-2,-14 L-2,-8 L2,-8 L2,-14 L8,-14 L8,-8 L14,-8 L14,-14 L20,-14 L20,20Z" fill="${c}"/><path d="M-5,20 L-5,8 Q0,2 5,8 L5,20Z" fill="#fff" opacity=".55"/>`,
  pajaro: (c) => `<path d="M-22,-2 Q-12,-16 -2,-4 Q8,-18 22,-8 Q10,-4 4,6 Q-2,14 -12,10 Q-18,8 -22,-2Z" fill="${c}"/><circle cx="-13" cy="-4" r="2.2" fill="#fff"/><path d="M-6,12 L-8,20 M2,10 L2,18" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`,
  sol: (c) => `<circle r="10" fill="${c}"/>` + Array.from({ length: 8 }, (_, i) => { const a = (i * Math.PI) / 4; return `<path d="M${(15 * Math.cos(a)).toFixed(1)},${(15 * Math.sin(a)).toFixed(1)} L${(22 * Math.cos(a)).toFixed(1)},${(22 * Math.sin(a)).toFixed(1)}" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`; }).join(''),
  flor: (c) => Array.from({ length: 5 }, (_, i) => { const a = (i * 2 * Math.PI) / 5 - Math.PI / 2; return `<ellipse cx="${(11 * Math.cos(a)).toFixed(1)}" cy="${(11 * Math.sin(a)).toFixed(1)}" rx="8" ry="8" fill="${c}"/>`; }).join('') + `<circle r="6" fill="#fff" opacity=".6"/>`,
};
const MONEDAS = [
  { v: '2', u: 'EURO', ext: 'plata', int: 'oro', motivo: 'arbol' },
  { v: '1', u: 'EURO', ext: 'oro', int: 'plata', motivo: 'barco' },
  { v: '50', u: 'CENT', ext: 'oro', motivo: 'castillo' },
  { v: '20', u: 'CENT', ext: 'oro', motivo: 'pajaro' },
  { v: '10', u: 'CENT', ext: 'oro', motivo: 'sol' },
  { v: '5', u: 'CENT', ext: 'cobre', motivo: 'flor' },
];
function moneda(padre, m) {
  const g = M.g(padre); const giro = M.g(g);
  const ext = METAL[m.ext], int = m.int ? METAL[m.int] : ext;
  const oscE = M.oscurece(ext, 0.3), osc = M.oscurece(int, 0.4);
  const base = `<circle r="46" fill="${ext}" ${SW(3.5)}/>` + (m.int ? `<circle r="29" fill="${int}" stroke="${oscE}" stroke-width="2.5"/>` : `<circle r="38" fill="none" stroke="${oscE}" stroke-width="2.5"/>`);
  let puntos = ''; for (let i = 0; i < 16; i++) { const a = (i * Math.PI) / 8; puntos += `<circle cx="${(m.int ? 37.5 : 42) * Math.cos(a)}" cy="${(m.int ? 37.5 : 42) * Math.sin(a)}" r="2" fill="${oscE}"/>`; }
  const brillo = `<path d="M-30,-26 A40,40 0 0 1 -6,-40" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".55"/>`;
  const cara = M.svg(giro, base + txtSvg(m.v, 0, m.v.length > 1 ? -5 : -6, m.v.length > 1 ? 30 : 34, M.oscurece(int, 0.55)) + txtSvg(m.u, 0, 17, 10, M.oscurece(int, 0.55)) + brillo);
  const cruz = M.svg(giro, base + puntos + `<g transform="scale(${m.int ? 1 : 1.3})">${MOTIVOS[m.motivo](osc)}</g>` + brillo);
  M.opacidad(cruz, 0);
  return {
    g, giro, cara, cruz,
    /** p: 0 = cara común; 1 = cara nacional (motivo). */
    voltear(p) { const c = Math.cos(Math.PI * M.clamp(p)); M.pon(giro, { sx: Math.max(0.03, Math.abs(c)) }); M.opacidad(cara, c >= 0 ? 1 : 0); M.opacidad(cruz, c < 0 ? 1 : 0); },
  };
}
/** Moneda grande genérica de euro (bimetálica con €). */
M.registrarIcono('euroGrande', () => {
  let p = ''; for (let i = 0; i < 24; i++) { const a = (i * Math.PI) / 12; p += `<circle cx="${(39 * Math.cos(a)).toFixed(1)}" cy="${(39 * Math.sin(a)).toFixed(1)}" r="1.6" fill="${M.oscurece(METAL.oro, 0.3)}"/>`; }
  return `<circle r="47" fill="${METAL.oro}" ${SW(3)}/>${p}<circle r="31" fill="${METAL.plata}" stroke="${M.oscurece(METAL.oro, 0.3)}" stroke-width="2.5"/>` +
    txtSvg('€', -1, 2, 40, C.grisOsc) + `<path d="M-34,-24 A42,42 0 0 1 -10,-40" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".6"/>`;
});

// ───────── Iconos propios ─────────
M.registrarIcono('monederoCuerpo', () => `<ellipse cx="0" cy="-8" rx="44" ry="9" fill="#5A2F2C"/>` +
  `<path d="M-48,-8 L48,-8 Q54,40 28,46 L-28,46 Q-54,40 -48,-8Z" fill="#B8645C" ${SW()}/>` +
  `<path d="M-40,2 L40,2 Q45,33 24,38 L-24,38 Q-45,33 -40,2Z" fill="none" stroke="#E2A99B" stroke-width="2.5" stroke-dasharray="5 5"/>` +
  `<circle cx="0" cy="20" r="6" fill="${METAL.oro}" ${SW(2.5)}/>`);
/** Tapa del monedero con la bisagra en (0,0) (esquina izquierda). */
M.registrarIcono('monederoTapa', () => `<path d="M0,0 Q-2,-34 48,-36 Q98,-34 96,0Z" fill="#A4544D" ${SW()}/>` +
  `<path d="M6,-4 Q8,-28 48,-30 Q88,-28 90,-4" fill="none" stroke="#C47A6A" stroke-width="3"/>` +
  `<rect x="-2" y="-5" width="100" height="8" rx="4" fill="${METAL.oro}" ${SW(2.5)}/><circle cx="90" cy="-8" r="5" fill="${METAL.oro}" ${SW(2.5)}/>`);
M.registrarIcono('derechos', () => `<path d="M0,-46 L38,-32 L38,0 Q38,32 0,46 Q-38,32 -38,0 L-38,-32Z" fill="${M.aclara(UE, 0.75)}" ${SW()}/>` +
  `<g transform="translate(0 6) scale(.62)">${M.iconos.grupo({})}</g><g transform="translate(0 -30) scale(.22)">${M.iconos.corazon({})}</g>`);
M.registrarIcono('pin', (o) => `<path d="M0,40 Q-30,4 -30,-12 A30,30 0 1 1 30,-12 Q30,4 0,40Z" fill="${o.color || UE}" ${SW(4)}/><circle cy="-12" r="11" fill="#fff" ${SW(3)}/>`);
M.registrarIcono('consejoEuropeo', () => {
  let p = ''; const n = 7;
  for (let i = 0; i < n; i++) { const a = Math.PI + (Math.PI * (i + 0.5)) / n; const x = 40 * Math.cos(a), y = 6 + 22 * Math.sin(a); p += `<g class="cab" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><path d="M-9,14 L-9,4 Q-9,-2 0,-2 Q9,-2 9,4 L9,14Z" fill="${M.ROPA[i % M.ROPA.length]}" ${SW(2.5)}/><circle cy="-9" r="7" fill="${M.PIEL[(i * 2) % M.PIEL.length]}" ${SW(2.5)}/></g>`; }
  return p + `<ellipse cx="0" cy="18" rx="48" ry="17" fill="#D9B98C" ${SW()}/><ellipse cx="0" cy="18" rx="30" ry="9" fill="${UE}" ${SW(2)}/>` + estrella5(0, 18, 7, ORO);
});
M.registrarIcono('consejoUE', () => {
  let p = '';
  [-30, 0, 30].forEach((x, i) => { p += `<path d="M${x - 12},${10} L${x - 12},${-6} Q${x - 12},${-14} ${x},${-14} Q${x + 12},${-14} ${x + 12},${-6} L${x + 12},10Z" fill="${['#7D8597', '#8E6C8A', '#6FB3A8'][i]}" ${SW(2.5)}/><circle cx="${x}" cy="-25" r="9" fill="${M.PIEL[[0, 3, 1][i]]}" ${SW(2.5)}/><path d="M${x - 3},${-12} L${x},${-4} L${x + 3},${-12}" fill="#fff" ${SW(1.5)}/>`; });
  p += `<rect x="-50" y="8" width="100" height="14" rx="4" fill="#D9B98C" ${SW(3)}/><path d="M-40,22 L-40,44 M40,22 L40,44" ${SW(5)}/>`;
  [-30, 0, 30].forEach((x) => { p += `<rect x="${x - 10}" y="0" width="20" height="9" rx="2" fill="#fff" ${SW(2)}/>`; });
  p += `<rect x="20" y="28" width="22" height="16" rx="3" fill="${C.tronco}" ${SW(2.5)}/><path d="M26,28 L26,24 L36,24 L36,28" fill="none" ${SW(2.5)}/>`;
  return p;
});
M.registrarIcono('comision', () => {
  let v = '';
  for (let f = 0; f < 5; f++) for (let c = 0; c < 4; c++) v += `<rect x="${-26 + c * 14}" y="${-24 + f * 13}" width="9" height="8" rx="1.5" fill="${(f + c) % 3 === 0 ? '#FFE8A3' : '#CFE3F0'}" ${SW(1.5)}/>`;
  return `<rect x="-34" y="-34" width="68" height="84" rx="4" fill="#E7ECF2" ${SW()}/>${v}<rect x="-10" y="36" width="20" height="14" rx="2" fill="${UE}" ${SW(2.5)}/>` +
    `<path d="M0,-34 L0,-58" ${SW(3)}/>`;
});
M.registrarIcono('bce', () => `<rect x="-26" y="-48" width="40" height="98" rx="4" fill="#CFE3F0" ${SW()}/><path d="M-26,-16 L14,-16 M-26,16 L14,16 M-6,-48 L-6,50" stroke="${C.gris}" stroke-width="2"/>` +
  `<rect x="-36" y="44" width="62" height="8" rx="3" fill="${C.grisOsc}" ${SW(2.5)}/>`);
M.registrarIcono('grua', () => `<path d="M-6,50 L-6,-40 L6,-40 L6,50Z" fill="${C.ayto === '#F4B942' ? '#E8A33D' : '#E8A33D'}" ${SW(3)}/>` +
  Array.from({ length: 6 }, (_, i) => `<path d="M-6,${44 - i * 15} L6,${32 - i * 15}" ${SW(2)}/>`).join('') +
  `<path d="M-30,-40 L80,-40 L80,-32 L-30,-32Z" fill="#E8A33D" ${SW(3)}/><path d="M0,-40 L0,-56 L-30,-40 M0,-56 L80,-40" fill="none" ${SW(2.5)}/><rect x="-36" y="-38" width="14" height="14" rx="2" fill="${C.grisOsc}" ${SW(2.5)}/>`);
M.registrarIcono('cabina', () => `<rect x="-24" y="-30" width="48" height="76" rx="4" fill="#DDE2EA" ${SW()}/><rect x="-16" y="-20" width="32" height="22" rx="3" fill="#CFE3F0" ${SW(2.5)}/><path d="M-30,-30 L30,-30 L24,-44 L-24,-44Z" fill="${C.grisOsc}" ${SW(3)}/>`);
M.registrarIcono('caja', (o) => {
  const prod = {
    fruta: `<circle cx="-10" cy="-30" r="11" fill="#E07A6A" ${SW(2.5)}/><circle cx="10" cy="-30" r="11" fill="#F2A65A" ${SW(2.5)}/><path d="M-10,-41 L-8,-46" ${SW(2.5, C.verdeOsc)}/>`,
    queso: `<path d="M-20,-22 L20,-22 L20,-40 L-14,-40Z" fill="#F7D774" ${SW(2.5)}/><circle cx="4" cy="-30" r="3" fill="#E2B650"/>`,
    botella: `<path d="M-6,-58 L6,-58 L6,-48 Q14,-44 14,-36 L14,-22 L-14,-22 L-14,-36 Q-14,-44 -6,-48Z" fill="#8CC0DE" ${SW(2.5)}/>`,
    ropa: `<path d="M-18,-42 L-8,-46 Q0,-40 8,-46 L18,-42 L24,-32 L16,-28 L14,-22 L-14,-22 L-16,-28 L-24,-32Z" fill="#9D8EC7" ${SW(2.5)}/>`,
  }[o.prod || 'fruta'];
  return prod + `<rect x="-30" y="-22" width="60" height="44" rx="4" fill="#D9B98C" ${SW()}/><path d="M-30,-6 L30,-6 M-30,8 L30,8" ${SW(2.5, C.tronco)}/>`;
});
M.registrarIcono('obraEdificio', () => {
  let p = `<rect x="-40" y="-20" width="80" height="70" rx="2" fill="#E9DCC8" ${SW()}/>`;
  for (let f = 0; f < 3; f++) for (let c = 0; c < 3; c++) p += `<rect x="${-30 + c * 22}" y="${-10 + f * 20}" width="14" height="12" rx="2" fill="#CFE3F0" ${SW(2)}/>`;
  p += `<path d="M-40,-20 L-40,-50 M40,-20 L40,-50 M-40,-50 L40,-50 M-40,-35 L40,-35 M-40,-50 L-20,-35 M0,-50 L20,-35" fill="none" ${SW(3, C.grisOsc)}/>`;
  return p;
});
M.registrarIcono('tienda', () => `<rect x="-44" y="-14" width="88" height="64" rx="3" fill="#F2E6D0" ${SW()}/>` +
  `<rect x="-34" y="4" width="34" height="26" rx="3" fill="#CFE3F0" ${SW(2.5)}/><rect x="10" y="4" width="24" height="46" rx="3" fill="${C.tronco}" ${SW(2.5)}/>` +
  `<path d="M-50,-14 L-50,-34 L50,-34 L50,-14 Q42,-4 34,-14 Q26,-4 17,-14 Q8,-4 0,-14 Q-8,-4 -17,-14 Q-26,-4 -34,-14 Q-42,-4 -50,-14Z" fill="#8CC0DE" ${SW(3)}/>` +
  [-34, 0, 34].map((x) => `<path d="M${x - 8},-34 L${x + 8},-34 L${x + 8},-14 Q${x},-6 ${x - 8},-14Z" fill="#fff"/>`).join('') +
  `<path d="M-50,-34 L50,-34" ${SW(3)}/>`);
M.registrarIcono('lupaV5', () => `<path d="M20,20 L44,44" ${SW(12)}/><path d="M20,20 L44,44" ${SW(6, C.tronco)}/><circle cx="-4" cy="-4" r="32" fill="#E8F3F8" fill-opacity=".18" ${SW(6)}/><path d="M-22,-16 A20,20 0 0 1 -12,-26" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`);
M.registrarIcono('flechaArriba', (o) => `<path d="M0,-44 L32,-6 L14,-6 L14,40 L-14,40 L-14,-6 L-32,-6Z" fill="${o.color || UE}" ${SW()}/>`);

// ═════════════════ Escena 1: el monedero ═════════════════
M.escena(1, (E) => {
  const g = E.g;
  const fase1 = M.g(g);
  M.el('rect', { x: 0, y: 590, width: 1280, height: 300, fill: C.arena }, fase1);

// ═════════════════ Escena 10: las cinco muñecas y repaso ═════════════════
M.escena(10, (E) => {
  const g = E.g;
  const NIV = [[C.ayto, 'Municipio'], [C.prov, 'Provincia'], [C.ccaa, 'Comunidad'], [C.estado, 'Estado'], [UE, 'Unión Europea']];
  const XS = [1085, 905, 705, 470, 200], SS = [1.05, 1.3, 1.55, 1.85, 2.25], BASE = 560;
  const munecas = NIV.map(([c], i) => munecaPartida(g, c, i === 4 ? { texto: 'UE', tamTexto: 15 } : {}));
  const nombres = NIV.map(([c, txt], i) => M.texto(g, txt, { tam: 28, peso: 900, color: i === 1 ? K : K }));
  const tCin = E.m('cinco muñecas'), tRep = E.m('Repasamos'), tUno = E.m('uno:'), tDos = E.m('dos:'), tY = E.m('Y ahora');
  const T0 = Math.max(1.0, tCin - 0.2), PASO = 0.8;
  const TC = T0 + 4 * PASO;   // la muñeca cerrada pasa al centro…
  const TB = Math.max(TC + 1.6, tDos - 0.9);   // …y después junto al título
  const ideas = M.ideasClave(E, { titulo: 'Repasamos', y: 140, colores: [UE, UE, UE], tTitulo: tRep - 0.1 });
  const banderita = M.icono('banderaUEv5', g);
  const r5 = M.rotulo(g, '¡Las cinco muñecas!', { tam: 34, fondo: UE });
  const r5b = M.rotulo(g, '5 muñecas en 1', { tam: 34, fondo: UE });
  const rPreg = M.rotulo(g, '¡Ahora, unas preguntas!', { tam: 34, fondo: C.ok });
  return (t, d) => {
    // posición «base» de cada muñeca (pies en BASE)
    const st = munecas.map((m, i) => ({ x: XS[i], s: SS[i], yp: BASE, o: 1, abre: 0 }));
    for (let k = 0; k < 4; k++) {
      const t0 = T0 + k * PASO;
      const q = M.p(t, t0, PASO);
      const ab = Math.min(M.e(t, t0, PASO * 0.3), 1 - M.e(t, t0 + PASO * 0.7, PASO * 0.3, 'outQuad'));
      st[k + 1].abre = ab * 1.4;
      // la pila k viaja hacia la muñeca k+1
      const mv = M.e(t, t0 + PASO * 0.12, PASO * 0.6, 'inOutCubic');
      if (q > 0) {
        st[k].x = M.lerp(XS[k], XS[k + 1], mv);
        st[k].s = M.lerp(SS[k], SS[k + 1] * 0.72, mv);
        st[k].yp = M.lerp(BASE, BASE - SS[k + 1] * 8, mv) - Math.sin(Math.PI * mv) * (40 + SS[k + 1] * 40);
      }
      if (q >= 0.78) st[k].o = 0;
      // las que ya están dentro siguen ocultas
      for (let j = 0; j < k; j++) if (t >= T0 + j * PASO + PASO * 0.78) st[j].o = 0;
    }
    const vc = M.e(t, TC, 0.7, 'inOutCubic');
    const va = M.e(t, TB, 0.8, 'inOutCubic');
    munecas.forEach((m, i) => {
      const a = M.aparicion(t, 0.05 + (4 - i) * 0.1, 0.5, 'sube');
      let { x, s, yp, o, abre } = st[i];
      let y = yp - 50 * s;
      if (i === 4) { x = M.lerp(M.lerp(x, 640, vc), 395, va); y = M.lerp(M.lerp(y, 552 - 50 * 2.3, vc), 72, va); s = M.lerp(M.lerp(s, 2.3, vc), 0.9, va); }
      m.abrir(abre);
      M.ponAp(m.g, { x, y: y + M.onda(t, 2.4, 2.5, i), s, r: M.onda(t, 3, 1.5, i), o }, a);
      const fueraN = i < 4 ? fuera(t, T0 + i * PASO + 0.1, 0.3) : fuera(t, TC - 0.1, 0.3);
      M.ponAp(nombres[i], { x: XS[i], y: BASE + 36, o: fueraN }, M.aparicion(t, 0.3 + (4 - i) * 0.1, 0.5, 'fundido'));
    });
